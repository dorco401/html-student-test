<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>המשחק של דור המלך</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* מסך פתיחה וטבלת מובילים */
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(11, 12, 16, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }
        h1.title {
            font-size: 40px;
            color: #ff5722;
            text-shadow: 0 0 20px #ff5722;
            margin-bottom: 10px;
        }
        h2.subtitle {
            font-size: 24px;
            color: #4dc3ff;
            max-width: 800px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #45a29e;
            color: #0b0c10;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 0 15px #45a29e;
            transition: 0.2s;
            margin-bottom: 30px;
        }
        .btn:hover { background-color: #66fcf1; transform: scale(1.05); }

        #leaderboardContainer {
            background: #1f2833;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #66fcf1;
            width: 300px;
        }
        #leaderboardContainer h3 { margin-top: 0; color: #f1c40f; }
        #leaderboardList { list-style: none; padding: 0; margin: 0; }
        #leaderboardList li {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #45a29e;
        }

        /* אנימציית מעבר שלב */
        #transitionScreen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 50;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #levelUpText {
            font-size: 60px;
            color: #f1c40f;
            text-shadow: 0 0 30px #f1c40f;
            z-index: 51;
            margin-bottom: -100px;
        }
        .flying-donkey {
            font-size: 150px;
            position: absolute;
            animation: flyAcross 2.5s ease-in-out forwards;
        }
        @keyframes flyAcross {
            0% { transform: translate(-50vw, 50vh) scale(0.5) rotate(-20deg); opacity: 0; }
            50% { transform: translate(0, 0) scale(1.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(50vw, -50vh) scale(0.5) rotate(20deg); opacity: 0; }
        }

        /* ממשק המשחק */
        .stats-container {
            display: flex;
            gap: 20px;
            font-size: 20px;
            margin: 15px 0 10px 0;
            font-weight: bold;
        }
        canvas {
            background-color: #000;
            border: 3px solid #45a29e;
            box-shadow: 0 0 15px #45a29e;
            border-radius: 5px;
            transition: box-shadow 0.5s;
        }
        #powerupStatus { color: #f39c12; min-height: 24px; font-weight: bold; margin-bottom: 5px; }
        #gameContainer { display: none; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <!-- מסך פתיחה -->
    <div id="startScreen">
        <h1 class="title">המשחק של דור המלך 👑</h1>
        <h2 class="subtitle">בואו לשחק ולקבל פרסים משוגעים!<br>מי שיזכה במקום הראשון מקבל טסלה 🚗</h2>
        <button class="btn" onclick="startGame()">התחל משחק</button>
        
        <div id="leaderboardContainer">
            <h3>🏆 טבלת אלופים (Top 5)</h3>
            <ul id="leaderboardList"></ul>
        </div>
    </div>

    <!-- מסך מעבר שלב -->
    <div id="transitionScreen">
        <div id="levelUpText">שלב 2!</div>
        <div class="flying-donkey" id="animatedDonkey">🐴🚀</div>
    </div>

    <!-- אזור המשחק -->
    <div id="gameContainer">
        <div class="stats-container">
            <div id="scoreBoard">ניקוד: 0</div>
            <div id="levelBoard">שלב: 1</div>
        </div>
        <div id="powerupStatus"></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('scoreBoard');
        const levelBoard = document.getElementById('levelBoard');
        const powerupStatus = document.getElementById('powerupStatus');
        
        const startScreen = document.getElementById('startScreen');
        const gameContainer = document.getElementById('gameContainer');
        const transitionScreen = document.getElementById('transitionScreen');
        const levelUpText = document.getElementById('levelUpText');
        const animatedDonkey = document.getElementById('animatedDonkey');
        const leaderboardList = document.getElementById('leaderboardList');

        let score = 0;
        let level = 1;
        let isPaused = false;
        let gameOver = false;
        let frames = 0;

        // מערכת Leaderboard
        let leaderboard = JSON.parse(localStorage.getItem('dorKingLeaderboard')) || [];
        
        function updateLeaderboardDisplay() {
            leaderboardList.innerHTML = '';
            if (leaderboard.length === 0) {
                leaderboardList.innerHTML = '<li>אין עדיין שיאים. תהיו הראשונים!</li>';
            } else {
                leaderboard.forEach((entry, index) => {
                    let li = document.createElement('li');
                    li.innerHTML = `<span>#${index + 1} ${entry.name}</span> <span>${entry.score} נק'</span>`;
                    leaderboardList.appendChild(li);
                });
            }
        }
        updateLeaderboardDisplay();

        function saveScore(newScore) {
            if (newScore > 0) {
                let playerName = prompt("המשחק נגמר! הכנס את שמך לטבלת המובילים (מיקום ראשון זוכה בטסלה!):") || "שחקן אנונימי";
                leaderboard.push({ name: playerName, score: newScore });
                leaderboard.sort((a, b) => b.score - a.score);
                leaderboard = leaderboard.slice(0, 5); // שומר רק 5 ראשונים
                localStorage.setItem('dorKingLeaderboard', JSON.stringify(leaderboard));
            }
        }

        // משתני משחק
        let player = { x: 375, y: 530, width: 50, height: 50, speed: 8, dx: 0, hasShield: false, multiShot: false };
        let bullets = [];
        let enemies = [];
        let powerUps = [];
        
        let enemySpawnRate = 70;
        let powerUpSpawnRate = 350;
        let enemyBaseSpeed = 2;
        let activeTimers = { shield: null, laser: null };

        function resetGameParams() {
            score = 0;
            level = 1;
            player.x = canvas.width / 2 - 25;
            player.hasShield = false;
            player.multiShot = false;
            bullets = [];
            enemies = [];
            powerUps = [];
            enemySpawnRate = 70;
            enemyBaseSpeed = 2;
            gameOver = false;
            isPaused = false;
            scoreBoard.innerText = "ניקוד: 0";
            levelBoard.innerText = "שלב: 1";
            powerupStatus.innerText = "";
            canvas.style.borderColor = "#45a29e";
            canvas.style.boxShadow = "0 0 15px #45a29e";
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameContainer.style.display = 'flex';
            resetGameParams();
            requestAnimationFrame(loop);
        }

        // מעבר שלב
        function checkLevelUp() {
            let nextLevel = Math.floor(score / 100) + 1;
            if (nextLevel > level) {
                level = nextLevel;
                levelBoard.innerText = "שלב: " + level;
                
                // שינוי צבע המסגרת לפי שלב
                const colors = ["#45a29e", "#ff5722", "#9c27b0", "#e91e63", "#00bcd4"];
                let currentColor = colors[Math.min(level - 1, colors.length - 1)];
                canvas.style.borderColor = currentColor;
                canvas.style.boxShadow = `0 0 25px ${currentColor}`;

                // הפעלת אנימציית מעבר
                triggerTransitionAnimation();
                
                // הגברת קושי
                enemySpawnRate = Math.max(20, 70 - (level * 10));
                enemyBaseSpeed = 2 + (level * 0.8);
            }
        }

        function triggerTransitionAnimation() {
            isPaused = true;
            levelUpText.innerText = `שלב ${level}!`;
            transitionScreen.style.display = 'flex';
            
            // איפוס האנימציה כדי שתפעל מחדש
            animatedDonkey.style.animation = 'none';
            animatedDonkey.offsetHeight; // Trigger reflow
            animatedDonkey.style.animation = 'flyAcross 2.5s ease-in-out forwards';

            setTimeout(() => {
                transitionScreen.style.display = 'none';
                isPaused = false;
                requestAnimationFrame(loop);
            }, 2500);
        }

        // ציור ועדכון
        function drawPlayer() {
            ctx.font = "50px Arial";
            ctx.fillText("👽", player.x, player.y + 40);
            if (player.hasShield) {
                ctx.beginPath();
                ctx.arc(player.x + 25, player.y + 25, 35, 0, Math.PI * 2);
                ctx.strokeStyle = "#4dc3ff";
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function activatePowerUp(type) {
            if (type === 'shield') {
                player.hasShield = true;
                powerupStatus.innerText = "מגן פעיל!";
                powerupStatus.style.color = "#4dc3ff";
                clearTimeout(activeTimers.shield);
                activeTimers.shield = setTimeout(() => { player.hasShield = false; if(!player.multiShot) powerupStatus.innerText = ""; }, 5000);
            } else if (type === 'laser') {
                player.multiShot = true;
                powerupStatus.innerText = "ירי משולש פעיל!";
                powerupStatus.style.color = "#f1c40f";
                clearTimeout(activeTimers.laser);
                activeTimers.laser = setTimeout(() => { player.multiShot = false; if(!player.hasShield) powerupStatus.innerText = ""; }, 5000);
            }
        }

        function update() {
            if (gameOver || isPaused) return;

            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            bullets.forEach((b, index) => {
                b.y -= b.speed;
                b.x += b.dx;
                if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
            });

            if (frames % enemySpawnRate === 0) {
                enemies.push({ x: Math.random() * (canvas.width - 50), y: -50, width: 50, height: 50, speed: Math.random() * 2 + enemyBaseSpeed });
            }

            if (frames % powerUpSpawnRate === 0) {
                powerUps.push({ x: Math.random() * (canvas.width - 40), y: -40, width: 40, height: 40, speed: 3, type: Math.random() > 0.5 ? 'shield' : 'laser' });
            }

            powerUps.forEach((p, pIndex) => {
                p.y += p.speed;
                if (p.y > canvas.height) powerUps.splice(pIndex, 1);
                else if (player.x < p.x + p.width && player.x + player.width > p.x && player.y < p.y + p.height && player.y + player.height > p.y) {
                    activatePowerUp(p.type);
                    powerUps.splice(pIndex, 1);
                }
            });

            enemies.forEach((e, eIndex) => {
                e.y += e.speed;
                if (level >= 2) e.x += Math.sin(frames * 0.05 + eIndex) * (level * 0.5); // תנועה גלית חזקה יותר בשלבים מתקדמים

                if (e.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                    score = Math.max(0, score - 5);
                    scoreBoard.innerText = "ניקוד: " + score;
                }

                bullets.forEach((b, bIndex) => {
                    if (b.x > e.x && b.x < e.x + e.width && b.y > e.y && b.y < e.y + e.height) {
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        scoreBoard.innerText = "ניקוד: " + score;
                        checkLevelUp();
                    }
                });

                if (player.x < e.x + e.width - 15 && player.x + player.width - 15 > e.x && player.y < e.y + e.height - 15 && player.y + player.height - 15 > e.y) {
                    if (player.hasShield) {
                        enemies.splice(eIndex, 1);
                    } else {
                        endGame();
                    }
                }
            });

            frames++;
        }

        function endGame() {
            gameOver = true;
            saveScore(score);
            updateLeaderboardDisplay();
            gameContainer.style.display = 'none';
            startScreen.style.display = 'flex';
        }

        function draw() {
            ctx.fillStyle = `rgba(${Math.min(30 * level, 100)}, 0, 0, 0.4)`; // הרקע מאדים ככל שעולים שלב
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // ציור כוכבים
            ctx.fillStyle = "white";
            if (frames % (Math.max(2, 10 - level)) === 0) ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);

            drawPlayer();
            
            ctx.font = "40px Arial";
            powerUps.forEach(p => ctx.fillText(p.type === 'shield' ? "🛡️" : "⚡", p.x, p.y + 35));
            
            ctx.fillStyle = "#66fcf1";
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill(); });
            
            ctx.font = "50px Arial";
            enemies.forEach(e => ctx.fillText("🐴", e.x, e.y + 40));
        }

        function loop() {
            if (!isPaused && !gameOver) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (isPaused || gameOver) return;
            if (e.key === 'ArrowLeft') player.dx = -player.speed;
            if (e.key === 'ArrowRight') player.dx = player.speed;
            if (e.key === ' ' || e.key === 'Spacebar') {
                if (player.multiShot) {
                    bullets.push({ x: player.x + player.width / 2, y: player.y, radius: 5, speed: 10, dx: 0 });
                    bullets.push({ x: player.x + player.width / 2, y: player.y, radius: 5, speed: 10, dx: -3 });
                    bullets.push({ x: player.x + player.width / 2, y: player.y, radius: 5, speed: 10, dx: 3 });
                } else {
                    bullets.push({ x: player.x + player.width / 2, y: player.y, radius: 5, speed: 10, dx: 0 });
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0;
        });

    </script>
</body>
</html>
